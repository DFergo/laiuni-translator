# T2 — frontend on a VPS without Tailscale. No inbound ports at all.
#
# cloudflared (remotely-managed tunnel, token below) publishes two hostnames,
# both pointing at this compose network:
#   <public hostname>   → http://translator-frontend:80     (users)
#   <backend hostname>  → http://translator-frontend:8080   (Translator backend only)
# The backend hostname is protected by a Cloudflare Access application whose only
# policy is "Service Auth" with a service token held by the backend; enable
# "Protect with Access" (cloudflared validates the Access JWT) on that hostname.
# Register in the backend: URL https://<backend hostname> + the signing secret +
# extra headers CF-Access-Client-Id / CF-Access-Client-Secret, and public address
# https://<public hostname> (used in emailed download links).
#
#   cp .env.example .env   # fill in
#   docker compose up -d

services:
  translator-frontend:
    image: ghcr.io/dfergo/laiuni-translator-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    # no "ports:" — only cloudflared reaches it, over the compose network
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - translator-frontend-data:/app/data
    environment:
      - BACKEND_SURFACE_AUTH=${BACKEND_SURFACE_AUTH:-signed}
      - TRANSLATOR_BACKEND_SECRET=${TRANSLATOR_BACKEND_SECRET:-}
      - TRANSLATOR_BACKEND_SECRET_PREVIOUS=${TRANSLATOR_BACKEND_SECRET_PREVIOUS:-}
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    mem_limit: 1536m  # result ZIPs up to 512 MB are held in memory (≈2.5× peak) — see README
    cpus: 1.0
    pids_limit: 256

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN (Cloudflare Zero Trust → Networks → Tunnels)}
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m

  # Keeps the frontend image current (tag in FRONTEND_TAG). Optional. It holds the
  # Docker socket, so it only joins no network that users reach and only updates
  # containers labelled for it.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --cleanup --label-enable --schedule "0 0 4 * * *"
    environment:
      # Recent Docker Engines reject Watchtower's default API version (1.25)
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  edge:

volumes:
  translator-frontend-data:
