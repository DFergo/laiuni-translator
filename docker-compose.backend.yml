services:
  laiuni-backend:
    restart: unless-stopped
    # Pre-built image (ADR-021, Portainer option B): the CI builds Dockerfile.backend
    # — bundling Java + Okapi/Tikal — and pushes it to GHCR; Portainer pulls this tag.
    image: ghcr.io/dfergo/laiuni-translator-backend:latest
    pull_policy: always
    # Local dev — build instead of pulling (comment `image:`/`pull_policy:` above):
    # build:
    #   context: .
    #   dockerfile: Dockerfile.backend
    # BACKEND_PORT is REQUIRED — deploy fails clearly if it is not set.
    # Host port for the admin panel + /health. The backend is not internet-facing
    # (pull-inverse): this is local/admin access only, never exposed via Cloudflared.
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required — set the host port for the admin panel}:8000"
    volumes:
      # DATA_DIR = /app/data (Sprint 24 layout: config/, sessions/, campaigns/, deleted/).
      # Named volume (default — VPS/headless):
      - laiuni-data:/app/data
      # Bind mount alternative (local machine — files editable "a mano" in Finder):
      # comment the line above and use e.g.
      #   - /Users/you/laiuni-data:/app/data
    environment:
      - DEPLOYMENT_JSON_PATH=/app/config/deployment_backend.json
      # Installation-wide signing secret (≥ 32 chars, e.g. `openssl rand -hex 32`): used for
      # every signed frontend without its own secret. Same value as TRANSLATOR_BACKEND_SECRET
      # on those frontends. Optional — without it, signed frontends need their own secret.
      - TRANSLATOR_FRONTEND_SECRET=${TRANSLATOR_FRONTEND_SECRET:-}

volumes:
  laiuni-data:
