name: build-frontend

# Pre-built frontend image (Nginx + sidecar + built portal). Multi-arch: amd64
# (VPS) + arm64 (Raspberry Pi, Apple Silicon). The React build runs once on the
# build platform (Dockerfile uses --platform=$BUILDPLATFORM); only the small
# Python/Nginx runtime stage is built per architecture.
# main → :latest + :sha-<short>   (the nightly auto-updater follows :latest)

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'config/nginx/**'
      - 'config/supervisord.conf'
      - 'config/deployment_frontend.json'
      - 'Dockerfile.frontend'
      - '.dockerignore'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/dfergo/laiuni-translator-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # arm64 emulation for multi-arch
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
